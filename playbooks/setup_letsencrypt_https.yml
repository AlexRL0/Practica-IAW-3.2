---
- name: Configuración de Certbot en el balanceador
  hosts: balanceador
  become: yes
  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Instalar y actualizar snap
      snap:
        name: core
        state: latest

    - name: Eliminar instalaciones previas de certbot con apt
      apt:
        name: certbot
        state: absent

    - name: Instalar el cliente de certbot
      snap:
        name: certbot
        state: latest
        classic: yes

    - name: Crear alias para el comando certbot
      file:
        src: /snap/bin/certbot
        dest: /usr/bin/certbot
        state: link
        force: yes

    - name: Solicitar un certificado a Let's Encrypt
      command: certbot --nginx -m {{ certbot.email }} --agree-tos --no-eff-email -d {{ certbot.domain }} --non-interactive