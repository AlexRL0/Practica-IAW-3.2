---
- name: Configuración del servidor NFS
  hosts: nfs
  become: yes
  
  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Actualizar los repositorios
      apt:
        update_cache: yes

    - name: Actualizar los paquetes
      apt:
        upgrade: dist
        update_cache: yes

    - name: Instalar el servidor NFS
      apt:
        name: nfs-kernel-server
        state: present

    - name: Crear el directorio /var/www/html
      file:
        path: /var/www/html
        state: directory
        owner: nobody
        group: nogroup
        mode: '0755'

    - name: Copiar la plantilla exports a /etc/exports
      copy:
        src: ../nfs/exports
        dest: /etc/exports
        mode: '0644'

    - name: Reemplazar el valor de la plantilla en /etc/exports
      replace:
        path: /etc/exports
        regexp: 'FRONTEND_NETWORK'
        replace: "{{ nfscliente.client_ip }}"

    - name: Reiniciar el servicio NFS
      service:
        name: nfs-kernel-server
        state: restarted