---
- name: Configuración de WordPress
  hosts: backend
  become: yes

  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Eliminar la base de datos si existe
      mysql_db:
        name: "{{ WORDPRESS_DB_NAME }}"
        state: absent
        login_user: root

    - name: Crear la base de datos
      mysql_db:
        name: "{{ WORDPRESS_DB_NAME }}"
        state: present
        login_user: root

    - name: Eliminar el usuario si existe
      mysql_user:
        name: "{{ WORDPRESS_DB_USER }}"
        host: "{{ FRONTEND_PRIVATE_IP }}"
        state: absent
        login_user: root

    - name: Crear el usuario de WordPress
      mysql_user:
        name: "{{ WORDPRESS_DB_USER }}"
        host: "{{ FRONTEND_PRIVATE_IP }}"
        password: "{{ WORDPRESS_DB_PASSWORD }}"
        priv: "{{ WORDPRESS_DB_NAME }}.*:ALL"
        state: present
        login_user: root
