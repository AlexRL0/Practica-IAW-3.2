---
- name: Configuración de WordPress
  hosts: frontend
  become: yes
  
  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Eliminar la base de datos de wordpress si existe
      mysql_db:
        name: "{{ db.name }}"
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Crear la base de datos
      mysql_db:
        name: "{{ db.name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Eliminar el usuario de wordpress si existe
      mysql_user:
        name: "{{ db.user }}"
        host: "{{ db.frontend_private_ip }}"
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Crear el usuario de WordPress
      mysql_user:
        name: "{{ db.user }}"
        host: "{{ db.frontend_private_ip }}"
        password: "{{ db.password }}"
        priv: "{{ db.name }}.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock