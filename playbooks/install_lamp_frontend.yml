---
- name: Configuración de Apache y PHP en el fronted
  hosts: frontend
  become: yes

  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Actualizar los repositorios
      apt:
        update_cache: yes

    - name: Actualizar los paquetes
      apt:
        upgrade: dist
        update_cache: yes

    - name: Instalar el servidor web Apache
      apt:
        name: apache2
        state: present

    - name: Habilitar el módulo rewrite
      command: a2enmod rewrite

    - name: Copiar el archivo de configuración de Apache
      copy:
        src: ../conf/000-default.conf
        dest: /etc/apache2/sites-available
        mode: '0755'

    - name: Instalar PHP y algunos módulos de PHP para Apache y MySQL
      apt:
        name:
          - php
          - libapache2-mod-php
          - php-mysql
        state: present

    - name: Reiniciar el servicio de Apache para aplicar los cambios
      service:
        name: apache2
        state: restarted

    - name: Copiar el archivo de prueba de PHP en /var/www/html
      copy:
        src: ../php/index.php
        dest: /var/www/html
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Modificar el propietario y el grupo del archivo index.php
      file:
        path: /var/www/html
        owner: www-data
        group: www-data
        recurse: yes
