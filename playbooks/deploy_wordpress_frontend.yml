---
- name: Configuración de WordPress con WP-CLI en el frontend
  hosts: frontend
  become: yes

  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Eliminar descargas previas de WP-CLI
      file:
        path: /tmp/wp-cli.phar
        state: absent

    - name: Descargar el WP-CLI
      get_url:
        url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        dest: /tmp/wp-cli.phar

    - name: Asignar permisos de ejecución a WP-CLI
      file:
        path: /tmp/wp-cli.phar
        mode: '0755'

    - name: Mover el script WP-CLI al directorio /usr/local/bin
      command: mv /tmp/wp-cli.phar /usr/local/bin/wp
      become: yes

    - name: Eliminar instalaciones previas en /var/www/html
      file:
        path: "{{ wordpress.directory }}/*"
        state: absent

    - name: Descargar el código fuente de WordPress
      command: wp core download --locale={{ wordpress.locale }} --path={{ wordpress.directory }} --allow-root

    - name: Crear el archivo de configuración de WordPress
      command: wp config create --dbname={{ db.name }} --dbuser={{ db.user }} --dbpass={{ db.password }} --dbhost={{ db.BACKEND_PRIVATE_IP }} --path={{ wordpress.directory }} --allow-root

    - name: Instalar WordPress
      command: wp core install --url={{ wordpress.domain }} --title={{ wordpress.title }} --admin_user={{ wordpress.admin_user }} --admin_password={{ wordpress.admin_password }} --admin_email={{ wordpress.admin_email }} --path={{ wordpress.directory }} --allow-root

    - name: Instalar y activar el theme mindscape
      command: wp theme install mindscape --activate --path={{ wordpress.directory }} --allow-root

    - name: Instalar un plugin
      command: wp plugin install wps-hide-login --activate --path={{ wordpress.hide_login_url }} --allow-root

    - name: Configurar el plugin de WHL
      command: wp option update whl_page "{{ wordpress.hide_login_url }}" --path={{ wordpress.directory }} --allow-root

    - name: Configurar los enlaces permanentes
      command: wp rewrite structure '/%postname%/' --path={{ wordpress.directory }} --allow-root

    - name: Copiar el archivo .htaccess
      copy:
        src: ../htaccess/.htaccess
        dest: "{{ wordpress.directory }}/.htaccess"

    - name: Cambiar el propietario y el grupo al directorio /var/www/html/
      file:
        path: /var/www/html/
        owner: www-data
        group: www-data
        recurse: yes
