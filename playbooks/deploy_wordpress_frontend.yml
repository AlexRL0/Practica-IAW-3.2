---
- name: Configuración de WordPress
  hosts: frontend
  become: yes
  
  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Eliminar descargas previas de WP-CLI
      file:
        path: /tmp/wp-cli.phar
        state: absent

    - name: Descargar el WP-CLI
      get_url:
        url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        dest: /tmp/wp-cli.phar

    - name: Asignar permisos de ejecución a WP-CLI
      file:
        path: /tmp/wp-cli.phar
        mode: '0755'

    - name: Mover el script WP-CLI al directorio /usr/local/bin
      command: mv /tmp/wp-cli.phar /usr/local/bin/wp
      become: yes

    - name: Eliminar instalaciones previas en /var/www/html
      file:
        path: "{{ WORDPRESS_DIRECTORY }}/*"
        state: absent

    - name: Descargar el código fuente de WordPress
      command: wp core download --locale=es_ES --path={{ WORDPRESS_DIRECTORY }} --allow-root

    - name: Crear el archivo de configuración de WordPress
      command: wp config create --dbname={{ WORDPRESS_DB_NAME }} --dbuser={{ WORDPRESS_DB_USER }} --dbpass={{ WORDPRESS_DB_PASSWORD }} --dbhost={{ WORDPRESS_DB_HOST }} --path={{ WORDPRESS_DIRECTORY }} --allow-root

    - name: Instalar WordPress
      command: wp core install --url={{ LE_DOMAIN }} --title={{ WORDPRESS_TITULO }} --admin_user={{ WORDPRESS_USUARIO_ADMIN }} --admin_password={{ WORDPRESS_CONTRA_ADMIN }} --admin_email={{ WORDPRESS_EMAIL_ADMIN }} --path={{ WORDPRESS_DIRECTORY }} --allow-root

    - name: Instalar y activar el theme mindscape
      command: wp theme install mindscape --activate --path={{ WORDPRESS_DIRECTORY }} --allow-root

    - name: Instalar un plugin
      command: wp plugin install wps-hide-login --activate --path={{ WORDPRESS_DIRECTORY }} --allow-root

    - name: Configurar el plugin de WHL
      command: wp option update whl_page "{{ WORDPRESS_HIDE_LOGIN_URL }}" --path={{ WORDPRESS_DIRECTORY }} --allow-root

    - name: Configurar los enlaces permanentes
      command: wp rewrite structure '/%postname%/' --path={{ WORDPRESS_DIRECTORY }} --allow-root

    - name: Copiar el archivo .htaccess
      copy:
        src: ../htaccess/.htaccess
        dest: "{{ WORDPRESS_DIRECTORY }}/.htaccess"

    - name: Cambiar el propietario y el grupo al directorio /var/www/html/
      file:
        path: /var/www/html/
        owner: www-data
        group: www-data
        recurse: yes
