---
- name: Configuración del cliente NFS
  hosts: nfs
  become: yes
  
  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Actualizar los repositorios
      apt:
        update_cache: yes

    - name: Actualizar los paquetes
      apt:
        upgrade: dist
        update_cache: yes

    - name: Instalar el cliente NFS
      apt:
        name: nfs-common
        state: present

    - name: Montar el directorio NFS
      command: mount {{ NFS_SERVER_IP }}:/var/www/html /var/www/html

    - name: Actualizar /etc/fstab para montar el directorio NFS al iniciar
      lineinfile:
        path: /etc/fstab
        line: "{{ NFS_SERVER_IP }}:/var/www/html /var/www/html nfs auto,nofail,noatime,nolock,intr,tcp,actimeo=1800 0 0"
        create: yes